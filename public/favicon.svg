<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mr-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12111d" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="#a855f7" stroke-width="2" stroke-opacity="0.4" />
  <!-- Neon glow dot -->
  <circle cx="50" cy="14" r="3" fill="#38bdf8" />
  <!-- Monogram MR -->
  <text x="32" y="42" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="900" font-size="26" text-anchor="middle" fill="url(#mr-grad)" letter-spacing="1">MR</text>
</svg>
